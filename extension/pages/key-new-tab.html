<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="key_new_tab_document_title">KeyPilot</title>
    <!--
      Content scripts do not run on extension pages. Load early-inject here so
      KeyPilot chrome appears before the page module, same as regular web pages.
      This page is opened only by the New Tab key. It does not replace Chrome's
      new tab (no chrome_url_overrides).
    -->
    <script src="../early-inject.js"></script>
    <link rel="stylesheet" href="key-new-tab.css" />
    <link rel="stylesheet" href="kp-locale-fonts.css" />
  </head>
  <body>
    <div class="mesh-bg" aria-hidden="true">
      <span class="mesh-orb mesh-orb-a"></span>
      <span class="mesh-orb mesh-orb-b"></span>
      <span class="mesh-orb mesh-orb-c"></span>
      <span class="mesh-orb mesh-orb-d"></span>
      <span class="mesh-orb mesh-orb-e"></span>
    </div>

    <main class="stage">
      <img
        class="brand-logo"
        src="../icons/icon128.png"
        width="60"
        height="60"
        alt="KeyPilot"
      />

      <fieldset id="bookmarks-shelf" class="knt-fieldset" hidden>
        <legend data-i18n="key_new_tab_bookmarks_label">Toolbar bookmarks</legend>
        <nav id="bookmarks-bar" class="bookmarks-bar knt-scroll"></nav>
      </fieldset>

      <section class="search" aria-label="Search" data-i18n-aria-label="key_new_tab_search_label">
        <form id="search-form" class="search-form" role="search">
          <input
            id="search-input"
            class="search-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Search or enter address"
            data-i18n-placeholder="key_new_tab_search_placeholder"
            aria-autocomplete="list"
            aria-controls="search-suggestions"
          />
          <button class="search-submit" type="submit" data-i18n="key_new_tab_search_submit">Search</button>
        </form>
        <div
          id="search-suggestions"
          class="suggestions"
          role="listbox"
          hidden
          aria-label="Search suggestions"
          data-i18n-aria-label="key_new_tab_suggestions_label"
        ></div>
        <p id="engine-label" class="engine-label"></p>
      </section>

      <fieldset class="knt-fieldset top-sites-fieldset">
        <legend data-i18n="key_new_tab_top_sites_label">Top sites</legend>
        <div id="top-sites" class="top-sites-row knt-scroll"></div>
        <p id="top-sites-empty" class="empty" hidden data-i18n="key_new_tab_top_sites_empty">No top sites yet.</p>
      </fieldset>
    </main>

    <script type="module" src="key-new-tab.js"></script>
  </body>
</html>
