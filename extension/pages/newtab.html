<!doctype html>
<html data-theme="cyberforward">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="newtab_static_019">KeyPilot New Tab</title>
    <script src="newtab-display-boot.js"></script>
    <!--
      Content scripts do not run on extension pages (chrome_url_overrides newtab).
      Load early-inject here so the onboarding popover + control strip shells appear
      before the ES module bundle (same flicker-free path as regular web pages).
    -->
    <script src="../early-inject.js"></script>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <header class="topbar">
      <!-- Zone 1: identity + master power -->
      <div class="topbar-zone topbar-zone--identity">
        <div class="brand-lockup">
          <div class="brand-heading">
            <div class="title" data-i18n="newtab_static_020">KeyPilot</div>
            <span class="kp-switch-shortcut" title="Toggle KeyPilot on/off" data-i18n-title="newtab_static_001">Alt+K</span>
          </div>
          <label class="kp-switch kp-switch--brand" for="kp-enabled-toggle" title="Toggle KeyPilot on/off (global)" data-i18n-title="newtab_static_002">
            <input id="kp-enabled-toggle" class="kp-switch-input" type="checkbox" role="switch" aria-label="KeyPilot enabled" / data-i18n-aria-label="newtab_static_003">
            <span class="kp-switch-track" aria-hidden="true">
              <span class="kp-switch-thumb" aria-hidden="true"></span>
            </span>
            <span id="kp-enabled-text" class="kp-switch-state" aria-hidden="true" data-i18n="newtab_static_021">…</span>
          </label>
        </div>
      </div>

      <!-- Zone 2: overlay / UI visibility toggles -->
      <div class="topbar-zone topbar-zone--toggles" role="group" aria-label="Overlay toggles" data-i18n-aria-label="newtab_static_004">
        <span class="topbar-zone-label" data-i18n="newtab_static_022">Overlays</span>
        <div class="topbar-zone-body">
          <label class="kp-switch kp-switch--cell" for="kp-control-strip-toggle" title="Show/hide control strip (Alt+J to toggle)" data-i18n-title="newtab_static_005">
            <span class="kp-switch-meta">
              <span class="kp-switch-label" data-i18n="newtab_static_023">Ctrl Strip</span>
              <span class="kp-switch-shortcut">Alt+J</span>
            </span>
            <span class="kp-switch-control">
              <input id="kp-control-strip-toggle" class="kp-switch-input" type="checkbox" role="switch" aria-label="Control strip visible" / data-i18n-aria-label="newtab_static_006">
              <span class="kp-switch-track" aria-hidden="true">
                <span class="kp-switch-thumb" aria-hidden="true"></span>
              </span>
              <span id="kp-control-strip-text" class="kp-switch-state" aria-hidden="true" data-i18n="newtab_static_025">…</span>
            </span>
          </label>

          <label class="kp-switch kp-switch--cell" for="kp-keyboard-toggle" title="Show/hide floating keyboard reference" data-i18n-title="newtab_static_007">
            <span class="kp-switch-meta">
              <span class="kp-switch-label" data-i18n="newtab_static_026">Keyboard</span>
              <span class="kp-switch-shortcut">K</span>
            </span>
            <span class="kp-switch-control">
              <input id="kp-keyboard-toggle" class="kp-switch-input" type="checkbox" role="switch" aria-label="Keyboard reference visible" / data-i18n-aria-label="newtab_static_008">
              <span class="kp-switch-track" aria-hidden="true">
                <span class="kp-switch-thumb" aria-hidden="true"></span>
              </span>
              <span id="kp-keyboard-text" class="kp-switch-state" aria-hidden="true" data-i18n="newtab_static_028">…</span>
            </span>
          </label>
        </div>
      </div>

      <!-- Zone 3: display / theme -->
      <div class="topbar-zone topbar-zone--display">
        <span class="topbar-zone-label" data-i18n="newtab_static_029">Display</span>
        <div class="topbar-zone-body">
          <button
            id="btn-display"
            class="btn btn-secondary btn-display"
            type="button"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="nt-display-popover"
            title="Theme options"
           data-i18n-title="newtab_static_009">
            <span id="btn-display-summary" class="btn-display-summary" data-i18n="newtab_static_030">Theme: Earth</span>
            <span class="btn-display-caret" aria-hidden="true" data-i18n="newtab_static_031">▾</span>
          </button>
        </div>
      </div>

      <!-- Zone 4: navigation -->
      <div class="topbar-zone topbar-zone--nav" role="group" aria-label="Pages" data-i18n-aria-label="newtab_static_010">
        <span class="topbar-zone-label" data-i18n="newtab_static_032">Pages</span>
        <div class="topbar-zone-body topbar-zone-body--nav">
          <button id="btn-settings" class="btn btn-secondary btn-with-icon" type="button">
            <!-- Font Awesome Free solid "gear" -->
            <svg class="btn-fa-icon" viewBox="0 0 512 512" width="14" height="14" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M495.9 166.1c3.3 12.7 .9 26.3-7.1 36.1l-37.3 45.7c2.1 11.1 3.2 22.6 3.2 34.3s-1.1 23.2-3.2 34.3l37.3 45.7c8 9.8 10.4 23.4 7.1 36.1c-6.3 24.2-17.7 46.6-33.1 66.3c-8.1 10.3-21.2 14.9-33.9 12.1l-57.5-12.7c-17.9 15.3-38.4 27.3-60.7 35.4l-13.7 57.5c-2.9 12.1-12.9 21.1-25.4 22.4c-24.2 2.6-49.1 2.6-73.3 0c-12.5-1.3-22.5-10.3-25.4-22.4l-13.7-57.5c-22.3-8.1-42.8-20.1-60.7-35.4L71.6 436.6c-12.7 2.8-25.8-1.8-33.9-12.1C22.3 404.8 10.9 382.4 4.6 358.2c-3.3-12.7-.9-26.3 7.1-36.1l37.3-45.7c-2.1-11.1-3.2-22.6-3.2-34.3s1.1-23.2 3.2-34.3L11.7 161.9c-8-9.8-10.4-23.4-7.1-36.1C10.9 101.6 22.3 79.2 37.7 59.5c8.1-10.3 21.2-14.9 33.9-12.1l57.5 12.7c17.9-15.3 38.4-27.3 60.7-35.4L203.5 17.2c2.9-12.1 12.9-21.1 25.4-22.4c24.2-2.6 49.1-2.6 73.3 0c12.5 1.3 22.5 10.3 25.4 22.4l13.7 57.5c22.3 8.1 42.8 20.1 60.7 35.4l57.5-12.7c12.7-2.8 25.8 1.8 33.9 12.1c15.4 19.7 26.8 42.1 33.1 66.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/>
            </svg>
            <span data-i18n="newtab_static_033">Settings</span>
          </button>
          <button id="btn-guide" class="btn btn-with-icon" type="button">
            <!-- Font Awesome Free solid "book" -->
            <svg class="btn-fa-icon" viewBox="0 0 448 512" width="14" height="14" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm0 64c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm0 64c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16z"/>
            </svg>
            <span data-i18n="newtab_static_034">Guide</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="search card" aria-label="Search" data-i18n-aria-label="newtab_static_011">
        <form id="search-form">
          <input id="search-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" / data-i18n-placeholder="newtab_static_012">
          <button class="btn" type="submit" data-i18n="newtab_static_035">Go</button>
        </form>
        <div id="search-suggestions" class="suggestions" hidden></div>
        <div class="search-meta">
          <span id="engine-label" data-i18n="newtab_static_036">Engine: …</span>
        </div>
      </section>

      <section class="card top-sites-section" aria-label="Top visited sites" data-i18n-aria-label="newtab_static_013">
        <h2 data-i18n="newtab_static_037">Top visited sites</h2>
        <div id="top-sites" class="top-sites-list"></div>
      </section>

      <div class="toolbar-history-container">
        <section id="toolbar-bookmarks-section" class="card toolbar-section" aria-label="Toolbar bookmarks" data-i18n-aria-label="newtab_static_014">
          <h2 data-i18n="newtab_static_038">Toolbar bookmarks</h2>
          <div id="toolbar-bookmarks" class="toolbar kp-card-grid"></div>
          <div id="toolbar-empty" class="empty" hidden data-i18n="newtab_static_039">No toolbar bookmarks found.</div>
        </section>

        <section class="card history-section" aria-label="Recent history" data-i18n-aria-label="newtab_static_015">
          <h2 data-i18n="newtab_static_040">Recent history</h2>
          <div id="recent-history" class="history"></div>
        </section>
      </div>

      <section class="card bookmarks-card" aria-label="Bookmarks" data-i18n-aria-label="newtab_static_016">
        <div class="tabbar" role="tablist" aria-label="Bookmarks views" data-i18n-aria-label="newtab_static_017">
          <button
            id="tab-recent"
            class="tabbar-tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="panel-recent"
            data-panel="recent"
           data-i18n="newtab_static_041">Recent</button>
          <button
            id="tab-all"
            class="tabbar-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="panel-all"
            data-panel="all"
           data-i18n="newtab_static_042">All bookmarks</button>
        </div>

        <div id="panel-recent" role="tabpanel" aria-labelledby="tab-recent">
          <div class="bookmarks-header">
            <h2 data-i18n="newtab_static_043">Recent bookmarks</h2>
            <div id="bookmark-view-toggle" class="view-toggle" role="group" aria-label="Bookmark view" data-i18n-aria-label="newtab_static_018"></div>
          </div>
          <ol id="bookmark-list" class="bookmarks kp-card-grid"></ol>
          <div id="bookmark-empty" class="empty" hidden data-i18n="newtab_static_044">No bookmarks found.</div>
        </div>

        <div id="panel-all" role="tabpanel" aria-labelledby="tab-all" hidden>
          <div class="bookmarks-header">
            <h2 data-i18n="newtab_static_045">All bookmarks</h2>
          </div>
          <div id="all-bookmarks" class="bm-tree"></div>
          <div id="all-bookmarks-empty" class="empty" hidden data-i18n="newtab_static_046">No bookmarks found.</div>
        </div>
      </section>
    </main>

    <div id="modal-root" class="modal-root" hidden></div>
    <div id="focus-hint" class="focus-hint" hidden>
      <div class="focus-hint-scrim" aria-hidden="true"></div>
      <img
        class="focus-hint-bg"
        src="focus-hint-bg.svg"
        alt=""
        aria-hidden="true"
        draggable="false"
      />
    </div>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
