<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09091c"/><stop offset=".52" stop-color="#17172b"/><stop offset="1" stop-color="#09091c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d6a7ad"/><stop offset=".48" stop-color="#ffffff"/><stop offset="1" stop-color="#a8c8b8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1d1d32"/><stop offset="1" stop-color="#101023"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1=".12" y1="0" x2=".9" y2="1">
      <stop stop-color="#c9a0a6"/><stop offset=".22" stop-color="#a87880"/><stop offset=".58" stop-color="#7a4e57"/><stop offset="1" stop-color="#3a2428"/>
    </linearGradient>
    <linearGradient id="mouseRim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d6b4b8"/><stop offset=".4" stop-color="#8a5a62"/><stop offset="1" stop-color="#2e1c20"/>
    </linearGradient>
    <radialGradient id="leftClick" cx=".35" cy=".28" r=".8">
      <stop stop-color="#ffffff" stop-opacity=".18"/><stop offset=".5" stop-color="#c9a0a6" stop-opacity=".06"/><stop offset="1" stop-color="#2a161a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="buttonFade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".62" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="buttonMask" maskUnits="userSpaceOnUse" x="79" y="134" width="62" height="46">
      <rect x="79" y="134" width="62" height="46" fill="url(#buttonFade)"/>
    </mask>
    <linearGradient id="wheelFace" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3a2428"/><stop offset=".3" stop-color="#c9a0a6"/><stop offset=".58" stop-color="#8a5a62"/><stop offset="1" stop-color="#2e1c20"/>
    </linearGradient>
    <linearGradient id="keyWall" x1="0" y1=".2" x2="1" y2="1">
      <stop stop-color="#5c5c7a"/><stop offset=".5" stop-color="#2c2c46"/><stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="keyFace" x1=".05" y1="0" x2=".35" y2="1">
      <stop stop-color="#565674"/><stop offset=".16" stop-color="#3c3c58"/><stop offset="1" stop-color="#1e1e34"/>
    </linearGradient>
    <radialGradient id="keyDish" cx=".5" cy=".44" r=".62">
      <stop stop-color="#121220"/><stop offset=".68" stop-color="#26263e"/><stop offset="1" stop-color="#4e4e70"/>
    </radialGradient>
    <clipPath id="mouseClip">
      <rect x="79" y="134" width="62" height="88" rx="31"/>
    </clipPath>
  </defs>

  <rect width="440" height="280" fill="url(#bg)"/>
  <circle cx="48" cy="36" r="90" fill="#713d48" opacity=".18"/>
  <circle cx="400" cy="250" r="100" fill="#32604d" opacity=".16"/>

  <!-- Brand: name only (promo tiles are global, not localized) -->
  <text x="20" y="58" fill="url(#title)" font-size="38" font-weight="900" letter-spacing="-1.5" font-family="Inter, Segoe UI, sans-serif">KeyPilot</text>
  <rect x="22" y="70" width="51" height="3" fill="#d6a7ad"/>
  <rect x="75" y="70" width="57" height="3" fill="#a8c8b8"/>

  <!-- Single flow stage: mouse -> pressed key, no words -->
  <rect x="16" y="92" width="408" height="172" fill="url(#card)" stroke="#41415b" stroke-width="1.5"/>

  <!-- Mini mouse with click waves -->
  <ellipse cx="110" cy="232" rx="40" ry="5" fill="#000000" opacity=".4"/>
  <g fill="none" stroke="#a8c8b8" stroke-linecap="round">
    <path d="M 70,148 A 16,16 0 0 1 86,132" stroke-width="2.5" opacity=".9"/>
    <path d="M 60,148 A 26,26 0 0 1 86,122" stroke-width="2.5" opacity=".5"/>
    <line x1="50" y1="148" x2="40" y2="148" stroke-width="2.5" opacity=".9"/>
    <line x1="86" y1="112" x2="86" y2="102" stroke-width="2.5" opacity=".9"/>
  </g>
  <rect x="79" y="134" width="62" height="88" rx="31" fill="url(#mouseBody)"/>
  <rect x="79" y="134" width="62" height="88" rx="31" fill="none" stroke="url(#mouseRim)" stroke-width="1.75"/>
  <g clip-path="url(#mouseClip)">
    <g mask="url(#buttonMask)">
      <ellipse cx="96" cy="154" rx="16" ry="7" fill="#ffffff" opacity=".16" transform="rotate(-30 96 154)"/>
      <rect x="79" y="134" width="32" height="42" fill="url(#leftClick)"/>
    </g>
    <rect x="108.75" y="136" width="2.25" height="28" rx="1.1" fill="#3a2428"/>
    <rect x="110.4" y="140" width=".8" height="18" rx=".4" fill="#ffffff" opacity=".25"/>
  </g>
  <rect x="105" y="143" width="10" height="18" rx="5" fill="url(#wheelFace)"/>
  <rect x="107" y="146" width="2" height="8" rx="1" fill="#ffffff" opacity=".35"/>

  <!-- Sequence arrow badge -->
  <circle cx="180" cy="178" r="14" fill="#17172b" stroke="#a8c8b8" stroke-width="1.5"/>
  <line x1="173" y1="178" x2="185" y2="178" stroke="#a8c8b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="185,171 185,185 195,178" fill="#a8c8b8"/>

  <!-- Mini pressed keycap with press arrow driving into its click point -->
  <rect x="252" y="108" width="10" height="30" fill="#a8c8b8"/>
  <polygon points="242,138 262,138 252,152" fill="#a8c8b8"/>
  <rect x="216" y="146" width="108" height="108" rx="17" fill="none" stroke="#a8c8b8" stroke-width="2" opacity=".2"/>
  <rect x="223" y="153" width="94" height="94" rx="14" fill="none" stroke="#a8c8b8" stroke-width="2" opacity=".4"/>
  <ellipse cx="270" cy="248" rx="40" ry="5" fill="#000000" opacity=".45"/>
  <rect x="228" y="166" width="84" height="84" rx="12" fill="url(#keyWall)"/>
  <rect x="236" y="244" width="68" height="1.5" fill="#ffffff" opacity=".22"/>
  <rect x="228" y="160" width="84" height="84" rx="12" fill="url(#keyFace)" stroke="#9fbfb0" stroke-width="1.75"/>
  <rect x="240" y="172" width="60" height="56" rx="14" fill="url(#keyDish)"/>
  <rect x="250" y="176" width="40" height="3" rx="1.5" fill="#ffffff" opacity=".16"/>
  <circle cx="270" cy="198" r="21" fill="none" stroke="#a8c8b8" stroke-width="2" opacity=".35"/>
  <circle cx="270" cy="198" r="13" fill="none" stroke="#a8c8b8" stroke-width="2" opacity=".7"/>
  <circle cx="270" cy="198" r="4" fill="#a8c8b8"/>
</svg>
