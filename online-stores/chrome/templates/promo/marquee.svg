<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09091c"/><stop offset=".52" stop-color="#17172b"/><stop offset="1" stop-color="#09091c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d6a7ad"/><stop offset=".48" stop-color="#ffffff"/><stop offset="1" stop-color="#a8c8b8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1d1d32"/><stop offset="1" stop-color="#101023"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1=".12" y1="0" x2=".9" y2="1">
      <stop stop-color="#c9a0a6"/><stop offset=".22" stop-color="#a87880"/><stop offset=".58" stop-color="#7a4e57"/><stop offset="1" stop-color="#3a2428"/>
    </linearGradient>
    <linearGradient id="mouseRim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d6b4b8"/><stop offset=".4" stop-color="#8a5a62"/><stop offset="1" stop-color="#2e1c20"/>
    </linearGradient>
    <radialGradient id="leftClick" cx=".35" cy=".28" r=".8">
      <stop stop-color="#ffffff" stop-opacity=".18"/><stop offset=".5" stop-color="#c9a0a6" stop-opacity=".06"/><stop offset="1" stop-color="#2a161a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="buttonFade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".62" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="buttonMask" maskUnits="userSpaceOnUse" x="665" y="175" width="150" height="108">
      <rect x="665" y="175" width="150" height="108" fill="url(#buttonFade)"/>
    </mask>
    <linearGradient id="wheelFace" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3a2428"/><stop offset=".3" stop-color="#c9a0a6"/><stop offset=".58" stop-color="#8a5a62"/><stop offset="1" stop-color="#2e1c20"/>
    </linearGradient>
    <linearGradient id="keyWall" x1="0" y1=".2" x2="1" y2="1">
      <stop stop-color="#5c5c7a"/><stop offset=".5" stop-color="#2c2c46"/><stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="keyFace" x1=".05" y1="0" x2=".35" y2="1">
      <stop stop-color="#565674"/><stop offset=".16" stop-color="#3c3c58"/><stop offset="1" stop-color="#1e1e34"/>
    </linearGradient>
    <radialGradient id="keyDish" cx=".5" cy=".44" r=".62">
      <stop stop-color="#121220"/><stop offset=".68" stop-color="#26263e"/><stop offset="1" stop-color="#4e4e70"/>
    </radialGradient>
    <clipPath id="mouseClip">
      <rect x="665" y="175" width="150" height="210" rx="75"/>
    </clipPath>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="220" fill="#713d48" opacity=".18"/>
  <circle cx="1280" cy="500" r="240" fill="#32604d" opacity=".16"/>

  <!-- Brand: name only (promo tiles are global, not localized) -->
  <text x="60" y="292" fill="url(#title)" font-size="92" font-weight="900" letter-spacing="-4" font-family="Inter, Segoe UI, sans-serif">KeyPilot</text>
  <rect x="66" y="314" width="122" height="5" fill="#d6a7ad"/>
  <rect x="191" y="314" width="135" height="5" fill="#a8c8b8"/>

  <!-- Frame 1: mouse -->
  <rect x="560" y="88" width="360" height="384" fill="url(#card)" stroke="#41415b" stroke-width="2"/>
  <ellipse cx="740" cy="408" rx="78" ry="9" fill="#000000" opacity=".4"/>
  <rect x="665" y="175" width="150" height="210" rx="75" fill="url(#mouseBody)"/>
  <rect x="665" y="175" width="150" height="210" rx="75" fill="none" stroke="url(#mouseRim)" stroke-width="3"/>
  <g clip-path="url(#mouseClip)">
    <g mask="url(#buttonMask)">
      <ellipse cx="706" cy="224" rx="40" ry="18" fill="#ffffff" opacity=".16" transform="rotate(-30 706 224)"/>
      <rect x="665" y="175" width="78" height="100" fill="url(#leftClick)"/>
    </g>
    <rect x="738.25" y="180" width="3.5" height="64" rx="1.75" fill="#3a2428"/>
    <rect x="741" y="188" width="1.25" height="48" rx=".6" fill="#ffffff" opacity=".25"/>
  </g>
  <rect x="731" y="197" width="18" height="36" rx="9" fill="url(#wheelFace)"/>
  <rect x="735" y="202" width="3.5" height="16" rx="1.5" fill="#ffffff" opacity=".35"/>
  <g stroke="#5a3840" stroke-width="1.25" opacity=".4" stroke-linecap="round">
    <line x1="735" y1="208" x2="745" y2="208"/>
    <line x1="735" y1="215" x2="745" y2="215"/>
    <line x1="735" y1="222" x2="745" y2="222"/>
  </g>

  <!-- Sequence arrow badge -->
  <circle cx="970" cy="280" r="26" fill="#17172b" stroke="#a8c8b8" stroke-width="2"/>
  <line x1="950" y1="280" x2="972" y2="280" stroke="#a8c8b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="972,266 972,294 990,280" fill="#a8c8b8"/>

  <!-- Frame 2: pressed keycap with a press arrow driving into its click point -->
  <g transform="translate(20, 0)">
  <rect x="1000" y="88" width="336" height="384" fill="url(#card)" stroke="#41415b" stroke-width="2"/>

  <!-- Click ripple rings around the key -->
  <rect x="1073" y="208" width="190" height="190" rx="30" fill="none" stroke="#a8c8b8" stroke-width="3" opacity=".2"/>
  <rect x="1088" y="223" width="160" height="160" rx="24" fill="none" stroke="#a8c8b8" stroke-width="3" opacity=".4"/>

  <!-- Keycap: shadow, side wall, pressed top face with a concave dish -->
  <ellipse cx="1168" cy="385" rx="72" ry="10" fill="#000000" opacity=".45"/>
  <rect x="1098" y="225" width="140" height="140" rx="20" fill="url(#keyWall)"/>
  <rect x="1110" y="356" width="116" height="2.5" rx="1" fill="#ffffff" opacity=".22"/>
  <rect x="1098" y="215" width="140" height="140" rx="20" fill="url(#keyFace)" stroke="#9fbfb0" stroke-width="2.5"/>
  <rect x="1116" y="234" width="104" height="100" rx="24" fill="url(#keyDish)"/>
  <rect x="1132" y="240" width="72" height="5" rx="2.5" fill="#ffffff" opacity=".16"/>

  <!-- Click point on the key face -->
  <circle cx="1168" cy="277" r="36" fill="none" stroke="#a8c8b8" stroke-width="3" opacity=".35"/>
  <circle cx="1168" cy="277" r="22" fill="none" stroke="#a8c8b8" stroke-width="3" opacity=".7"/>
  <circle cx="1168" cy="277" r="7" fill="#a8c8b8"/>

  <!-- Press arrow (drawn last so it sits above the key) -->
  <rect x="1160" y="141" width="16" height="52" fill="#a8c8b8"/>
  <polygon points="1144,193 1192,193 1168,221" fill="#a8c8b8"/>
  </g>
</svg>
