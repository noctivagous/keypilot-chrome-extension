<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#14171c"/>
  <image href="{{captureHref}}" x="0" y="0" width="1280" height="800" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1280" height="100" fill="rgba(20,23,28,0.90)"/>
  <rect x="0" y="700" width="1280" height="100" fill="rgba(20,23,28,0.90)"/>
  <rect x="0" y="0" width="8" height="800" fill="#ff8c00"/>
  <text
    data-copy="headline"
    data-max-chars="64"
    x="40"
    y="64"
    fill="#f4f6f8"
    font-family="Titillium Web, Noto Sans JP, Noto Sans SC, Noto Sans TC, Noto Sans HK, Hiragino Sans, Hiragino Sans GB, PingFang SC, PingFang TC, STHeiti, Segoe UI, system-ui, sans-serif"
    font-size="35.2"
    font-weight="700">{{headline}}</text>
  <g transform="translate(40,732)">
    <path d="M5 14 H20 M14 8 L21 14 L14 20" fill="none" stroke="#ff8c00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text
      data-copy="callout.0"
      data-max-chars="72"
      x="40"
      y="21.5"
      fill="#f4f6f8"
      font-family="Titillium Web, Noto Sans JP, Noto Sans SC, Noto Sans TC, Noto Sans HK, Hiragino Sans, Hiragino Sans GB, PingFang SC, PingFang TC, STHeiti, Segoe UI, system-ui, sans-serif"
      font-size="25.3">{{callout.0}}</text>
  </g>
  <g transform="translate(420,732)">
    <path d="M5 14 H20 M14 8 L21 14 L14 20" fill="none" stroke="#ff8c00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text
      data-copy="callout.1"
      data-max-chars="72"
      x="40"
      y="21.5"
      fill="#f4f6f8"
      font-family="Titillium Web, Noto Sans JP, Noto Sans SC, Noto Sans TC, Noto Sans HK, Hiragino Sans, Hiragino Sans GB, PingFang SC, PingFang TC, STHeiti, Segoe UI, system-ui, sans-serif"
      font-size="25.3">{{callout.1}}</text>
  </g>
</svg>
