<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KeyPilot UI flow fixture</title>
  <style>
    body {
      margin: 0;
      font: 16px/1.5 system-ui, sans-serif;
      background: #f4f1ea;
      color: #1b1f24;
    }
    .stage {
      margin-left: 400px;
      padding: 160px 32px 32px;
      min-height: 4200px;
    }
    .practice {
      position: fixed;
      top: 72px;
      right: 28px;
      z-index: 1;
      width: 280px;
      padding: 12px;
      background: #fff;
      border: 1px solid #c5c0b6;
    }
    a { color: #0b57d0; }
    input[type="text"] {
      display: block;
      margin: 8px 0 0;
      padding: 10px 12px;
      width: 100%;
      box-sizing: border-box;
      font: inherit;
    }
    .filler { color: #6b7280; max-width: 40em; }
  </style>
</head>
<body>
  <div class="practice">
    <p>
      <a id="practice-link" href="/next.html">Practice link to the next page</a>
    </p>
    <p>
      <a id="practice-link-2" href="/next.html">Second practice link</a>
    </p>
    <label for="practice-field">Practice text field</label>
    <input id="practice-field" type="text" name="q" autocomplete="off" />
  </div>
  <main class="stage">
    <h1>UI flow fixture</h1>
    <div class="filler">
      <p>Tall page so scroll tasks can move the viewport.</p>
      <p>Alpha Bravo Charlie Delta Echo Foxtrot Golf Hotel India Juliet.</p>
      <p>Kilo Lima Mike November Oscar Papa Quebec Romeo Sierra Tango.</p>
      <p>Uniform Victor Whiskey X-ray Yankee Zulu.</p>
    </div>
  </main>
</body>
</html>
