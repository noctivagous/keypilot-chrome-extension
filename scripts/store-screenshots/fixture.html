<!doctype html>
<html lang="en">
<head>

  <title>Harbor Weekly — City edition</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #e7e1d4;
      color: #1b1f24;
      font: 18px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, serif;

    p { max-width: 42rem; }
    a { color: #0b57d0; }

      display: flex;

<body>
  <header>
    <div class="kicker">Local news</div>
    <h1>Harbor lights return to the waterfront this weekend</h1>
    <p>
      Crews finished the last string of lamps along Pier 4 on Thursday. Evening
      walks reopen after dusk, and the market stalls below the promenade stay
      open an hour later.
    </p>
    <nav>
